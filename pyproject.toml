[project]
name = "shruti"
version = "0.1.0"
description = "WP Bot to transcribe audio and set calender event and store in sheets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "modal",
    "fastapi",
    "httpx",
    "groq",
    "gspread",
    "google-auth",
    "python-dotenv",
    "supabase>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests"
]

